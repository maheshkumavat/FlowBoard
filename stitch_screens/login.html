<!DOCTYPE html>

<html class="h-full bg-background" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CollabFlow - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "surface-container-highest": "#d3e4fe",
                        "secondary": "#4b5a9c",
                        "tertiary": "#5a5f65",

                        "primary-container": "#6063ee",

                        "error-container": "#ffdad6",
                        "surface-container-low": "#eff4ff",
                        "surface-container-high": "#dce9ff",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                    "spacing": {
                        "lg": "24px",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="h-full flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-surface-container-low text-on-surface">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl p-xl shadow-[0px_10px_24px_rgba(0,0,0,0.08)] border border-outline-variant/30 flex flex-col gap-lg">
<!-- Header -->
<div class="text-center flex flex-col gap-sm">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">CollabFlow</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to your AI-Powered Workspace</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-[12px] font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" id="email" name="email" required="" type="email"/>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-[12px] font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" id="password" name="password" required="" type="password"/>
</div>
<button class="w-full mt-sm bg-primary text-on-primary font-title-md text-title-md rounded-lg py-[12px] px-md hover:bg-on-primary-fixed-variant transition-colors flex items-center justify-center gap-sm" type="submit">
                Sign In
            </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-md">
<div class="flex-1 h-px bg-outline-variant/50"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Or</span>
<div class="flex-1 h-px bg-outline-variant/50"></div>
</div>
<!-- Secondary Actions -->
<div class="flex flex-col gap-sm">
<button class="w-full bg-surface-container border border-outline-variant text-on-surface font-title-md text-title-md rounded-lg py-[12px] px-md hover:bg-surface-container-high transition-colors flex items-center justify-center gap-sm" type="button">
<span aria-hidden="true" class="material-symbols-outlined text-[20px]" data-icon="code">code</span>
                Continue with GitHub
            </button>
<p class="text-center font-label-sm text-label-sm text-on-surface-variant mt-xs">
                Connect later from your profile
            </p>
</div>
</div>
</body></html>
